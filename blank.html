<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank Template | J.S Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    body.dark-theme {
      --bg-page: #0b0f19;
      --bg-card: #111827;
      --bg-surface: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s ease, color 0.3s ease; }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
    }

    .header-left { display: flex; align-items: center; gap: 2.5rem; }

    .logo {
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .nav-bar { display: flex; gap: 1.5rem; align-items: center; }
    .nav-link {
      color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; position: relative; padding: 0.5rem 0;
    }
    .nav-link:hover { color: var(--primary); }

    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0;
      background-color: var(--bg-card); min-width: 160px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      border-radius: 8px; z-index: 200; overflow: hidden; padding: 0.5rem 0;
    }
    .dropdown-menu a {
      color: var(--text-main); padding: 0.6rem 1rem; text-decoration: none;
      display: block; font-size: 0.9rem; font-weight: 500;
    }
    .dropdown-menu a:hover { background-color: var(--bg-surface); color: var(--primary); }
    .dropdown:hover .dropdown-menu { display: block; }

    button {
      cursor: pointer; padding: 0.65rem 1.25rem; border-radius: 8px; border: 1px solid var(--border);
      font-weight: 600; font-size: 0.9rem; background: var(--bg-card); color: var(--text-main);
    }

    main { padding: 2rem; flex: 1; max-width: 1280px; margin: 0 auto; width: 100%; }

    footer {
      background: var(--bg-card); border-top: 1px solid var(--border);
      padding: 3rem 2rem 1.5rem; margin-top: auto;
    }
    .footer-container {
      max-width: 1280px; margin: 0 auto; display: grid;
      grid-template-columns: 2fr 1fr; gap: 2rem; margin-bottom: 2rem;
    }
    .footer-about h3, .footer-socials h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; }
    .footer-about p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; max-width: 600px; }
    .social-icons { display: flex; gap: 1rem; }
    .social-icon {
      width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center; color: var(--text-main);
      text-decoration: none; font-weight: 700; border: 1px solid var(--border);
    }
    .social-icon:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .footer-bottom {
      border-top: 1px solid var(--border); padding-top: 1.5rem; text-align: center;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">J.S Shop</a>
      <nav class="nav-bar">
        <a href="index.html" class="nav-link">Home</a>
        <div class="dropdown">
          <span class="nav-link">Categories ▾</span>
          <div class="dropdown-menu">
            <a href="#">Nike</a>
            <a href="#">Adidas</a>
            <a href="#">Puma</a>
            <a href="#">New Balance</a>
          </div>
        </div>
        <a href="#about-us" class="nav-link">About Us</a>
      </nav>
    </div>

    <div>
      <button id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>
  </header>

  <main>
    </main>

  <footer id="about-us">
    <div class="footer-container">
      <div class="footer-about">
        <h3>About Us</h3>
        <p>Short story about your store goes here...</p>
      </div>
      <div class="footer-socials">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#" class="social-icon">f</a>
          <a href="#" class="social-icon">ig</a>
          <a href="#" class="social-icon">tw</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 J.S Shop. All Rights Reserved.
    </div>
  </footer>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      document.getElementById('theme-toggle-btn').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
  </script>
</body>
</html>
