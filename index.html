<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.S Shop | Official Storefront</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      --radius: 12px;
    }

    body.dark-theme {
      --bg-page: #0b0f19;
      --bg-card: #111827;
      --bg-surface: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s ease, color 0.3s ease; }

    header {
      background-color: var(--bg-card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm);
    }

    .header-left { display: flex; align-items: center; gap: 2.5rem; }

    .logo {
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer; user-select: none; text-decoration: none;
    }

    /* Navigation Bar */
    .nav-bar { display: flex; gap: 1.5rem; align-items: center; }
    .nav-link {
      color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.95rem;
      transition: color 0.2s ease; cursor: pointer; position: relative; padding: 0.5rem 0;
    }
    .nav-link:hover { color: var(--primary); }

    /* Categories Dropdown */
    .dropdown { position: relative; display: inline-block; }
    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0;
      background-color: var(--bg-card); min-width: 160px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      border-radius: 8px; z-index: 200; overflow: hidden; padding: 0.5rem 0;
    }
    .dropdown-menu a {
      color: var(--text-main); padding: 0.6rem 1rem; text-decoration: none;
      display: block; font-size: 0.9rem; font-weight: 500; transition: background 0.2s ease;
    }
    .dropdown-menu a:hover { background-color: var(--bg-surface); color: var(--primary); }
    .dropdown:hover .dropdown-menu { display: block; }

    .nav-actions { display: flex; gap: 0.75rem; align-items: center; }

    button {
      cursor: pointer; padding: 0.65rem 1.25rem; border-radius: 8px; border: 1px solid transparent;
      font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    }

    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-outline { background: var(--bg-card); color: var(--text-main); border-color: var(--border); }
    .btn-outline:hover { background: var(--bg-surface); border-color: var(--border); }

    .badge-btn { position: relative; }
    .badge {
      background: var(--primary); color: #ffffff; border-radius: 9999px;
      padding: 2px 8px; font-size: 0.75rem; font-weight: 700;
    }

    main { padding: 2rem; flex: 1; max-width: 1280px; margin: 0 auto; width: 100%; }

    .view-section { display: none; }
    .view-section.active { display: block; animation: fadeIn 0.3s ease-in-out; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .controls-bar {
      display: flex; gap: 1rem; align-items: center; justify-content: flex-end;
      margin-bottom: 2rem; background: var(--bg-card); padding: 0.85rem 1.25rem; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: var(--shadow-md);
    }

    select {
      padding: 0.65rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-surface); color: var(--text-main); font-size: 0.9rem;
      cursor: pointer; transition: border-color 0.2s ease;
    }
    select:focus { border-color: var(--primary); }

    .hero-banner {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; margin-bottom: 2.5rem; box-shadow: var(--shadow-md); position: relative;
    }
    .hero-slide { display: none; grid-template-columns: 1fr 1fr; align-items: center; min-height: 380px; padding: 3rem; gap: 2rem; }
    .hero-slide.active { display: grid; }
    .hero-content { display: flex; flex-direction: column; gap: 1rem; }
    .hero-tag {
      align-self: flex-start; padding: 0.3rem 0.8rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      background: #dcfce7; color: #15803d;
    }

    .hero-title { font-size: 2.5rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
    .hero-desc { color: var(--text-muted); font-size: 1rem; line-height: 1.6; }
    .hero-price-row { display: flex; align-items: center; gap: 1.5rem; margin-top: 0.5rem; }
    .hero-price { font-size: 2rem; font-weight: 800; color: var(--text-main); }

    .hero-image-wrapper { height: 320px; width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); cursor: pointer; }
    .hero-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .hero-controls { position: absolute; bottom: 1.5rem; right: 1.5rem; display: flex; gap: 0.5rem; z-index: 10; }
    .hero-nav-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); font-weight: 700; padding: 0; }
    .hero-dots { position: absolute; bottom: 1.8rem; left: 3rem; display: flex; gap: 0.5rem; z-index: 10; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; transition: all 0.3s ease; }
    .dot.active { background: var(--primary); width: 24px; border-radius: 10px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.5rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease; position: relative;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .card-img-wrapper { height: 220px; overflow: hidden; background: var(--bg-surface); cursor: pointer; position: relative; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
    .card-img-wrapper:hover img { transform: scale(1.05); }

    .quick-view-badge {
      position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.75);
      color: #fff; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.75rem;
      font-weight: 600; opacity: 0; transition: opacity 0.2s ease; backdrop-filter: blur(4px);
    }
    .card-img-wrapper:hover .quick-view-badge { opacity: 1; }

    .card-body { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; }
    .card-header-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .card-category { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }

    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.4rem; }
    .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .card-price { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }

    /* Footer Section */
    footer {
      background: var(--bg-card); border-top: 1px solid var(--border);
      padding: 2rem 2rem 1.5rem; margin-top: 4rem;
    }
    .footer-container {
      max-width: 1280px; margin: 0 auto; display: flex;
      flex-direction: column; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem;
    }
    .footer-socials { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .footer-socials h3 { font-size: 1.1rem; font-weight: 700; }
    .social-icons { display: flex; gap: 1rem; }
    .social-icon {
      width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center; color: var(--text-main);
      text-decoration: none; font-weight: 700; border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .social-icon:hover { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    .footer-bottom {
      border-top: 1px solid var(--border); padding-top: 1.5rem; text-align: center;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 500; width: 100%;
    }

    @media (max-width: 900px) {
      .header-left { gap: 1rem; }
      .nav-bar { gap: 0.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">J.S Shop</a>
      <nav class="nav-bar">
        <a href="index.html" class="nav-link">Home</a>
        <div class="dropdown">
          <span class="nav-link">Categories ▾</span>
          <div class="dropdown-menu">
            <a href="#" onclick="filterByCategoryNav('Sneakers')">Sneakers</a>
            <a href="#" onclick="filterByCategoryNav('Formal')">Formal</a>
            <a href="#" onclick="filterByCategoryNav('Boots')">Boots</a>
            <a href="#" onclick="filterByCategoryNav('Sports')">Sports</a>
          </div>
        </div>
        <a href="#about-us" class="nav-link">About Us</a>
      </nav>
    </div>

    <div class="nav-actions">
      <button class="btn-outline" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
      <button class="btn-primary badge-btn" onclick="toggleCart()">
        Cart <span class="badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <main>
    <section id="user-view" class="view-section active">
      <div class="controls-bar">
        <select id="category-filter" onchange="applyFilters()">
          <option value="All">All Categories</option>
          <option value="Sneakers">Sneakers</option>
          <option value="Formal">Formal</option>
          <option value="Boots">Boots</option>
          <option value="Sports">Sports</option>
        </select>
        <select id="sort-filter" onchange="applyFilters()">
          <option value="default">Sort by: Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <div class="hero-banner">
        <div id="hero-carousel-container"></div>
        <div class="hero-dots" id="hero-dots"></div>
        <div class="hero-controls">
          <button class="hero-nav-btn" onclick="prevHeroSlide()">‹</button>
          <button class="hero-nav-btn" onclick="nextHeroSlide()">›</button>
        </div>
      </div>

      <div class="product-grid" id="product-container"></div>
    </section>
  </main>

  <footer id="about-us">
    <div class="footer-container">
      <div class="footer-socials">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#" class="social-icon" title="Facebook">f</a>
          <a href="#" class="social-icon" title="Instagram">ig</a>
          <a href="#" class="social-icon" title="Twitter">tw</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 J.S Shop. All Rights Reserved.
    </div>
  </footer>

  <script>
    let currentHeroIndex = 0;
    let heroTimer = null;

    const initialStockSnapshot = [
      { id: 1, name: "Air Runner Max", category: "Sneakers", price: 129.99, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600", desc: "Lightweight performance sneakers designed for maximum everyday comfort." },
      { id: 2, name: "Oxford Classic", category: "Formal", price: 159.99, image: "https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=600", desc: "Handcrafted genuine leather shoes built for elegance and formal wear." },
      { id: 3, name: "Summit Hiker", category: "Boots", price: 189.99, image: "https://images.unsplash.com/photo-1520639888713-7851133b1ed0?w=600", desc: "Durable terrain boots engineered to endure outdoor conditions." }
    ];

    let products = JSON.parse(localStorage.getItem('sole_products')) || initialStockSnapshot;

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('js_shop_theme', isDark ? 'dark' : 'light');
      document.getElementById('theme-toggle-btn').innerText = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    function renderHero() {
      const container = document.getElementById('hero-carousel-container');
      const dotsContainer = document.getElementById('hero-dots');
      if (!products.length) return;

      container.innerHTML = products.map((p, i) => `
        <div class="hero-slide ${i === currentHeroIndex ? 'active' : ''}">
          <div class="hero-content">
            <span class="hero-tag">Featured Collection</span>
            <h1 class="hero-title">${p.name}</h1>
            <p class="hero-desc">${p.desc}</p>
            <div class="hero-price-row">
              <span class="hero-price">$${p.price.toFixed(2)}</span>
            </div>
          </div>
          <div class="hero-image-wrapper">
            <img src="${p.image}" alt="${p.name}">
          </div>
        </div>
      `).join('');

      dotsContainer.innerHTML = products.map((_, i) => `
        <span class="dot ${i === currentHeroIndex ? 'active' : ''}" onclick="setHeroSlide(${i})"></span>
      `).join('');
    }

    function setHeroSlide(index) { currentHeroIndex = index; renderHero(); }
    function nextHeroSlide() { currentHeroIndex = (currentHeroIndex + 1) % products.length; renderHero(); }
    function prevHeroSlide() { currentHeroIndex = (currentHeroIndex - 1 + products.length) % products.length; renderHero(); }

    function filterByCategoryNav(categoryName) {
      document.getElementById('category-filter').value = categoryName;
      applyFilters();
    }

    function applyFilters() {
      const category = document.getElementById('category-filter').value;
      const sort = document.getElementById('sort-filter').value;

      let filtered = products.filter(p => category === 'All' || p.category === category);
      if (sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
      if (sort === 'price-high') filtered.sort((a,b) => b.price - a.price);

      renderProducts(filtered);
    }

    function renderProducts(items) {
      const container = document.getElementById('product-container');
      container.innerHTML = items.map(p => `
        <div class="card">
          <div class="card-img-wrapper">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="card-body">
            <div class="card-header-info">
              <span class="card-category">${p.category}</span>
            </div>
            <h3 class="card-title">${p.name}</h3>
            <p class="card-desc">${p.desc}</p>
            <div class="card-footer">
              <span class="card-price">$${p.price.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    applyFilters();
    renderHero();
  </script>
</body>
</html>
