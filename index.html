<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.S Shop | Official Storefront</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
      --radius: 12px;
    }

    body.dark-theme {
      --bg-page: #0b0f19;
      --bg-card: #111827;
      --bg-surface: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border: #374151;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html { scroll-behavior: smooth; }
    body { background-color: var(--bg-page); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s ease, color 0.3s ease; }

    header {
      background-color: var(--bg-card);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      position: sticky; top: 0; z-index: 1000; box-shadow: var(--shadow-sm);
      flex-wrap: wrap; gap: 1rem;
    }

    .header-left { display: flex; align-items: center; gap: 1.5rem; }

    .logo {
      font-size: 1.4rem; font-weight: 800;
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      cursor: pointer; user-select: none; text-decoration: none; white-space: nowrap;
    }

    .nav-bar { display: flex; gap: 1.25rem; align-items: center; }
    .nav-link {
      color: var(--text-main); text-decoration: none; font-weight: 600; font-size: 0.9rem;
      transition: color 0.2s ease; cursor: pointer; position: relative; padding: 0.5rem 0;
      white-space: nowrap; display: inline-block;
    }
    .nav-link:hover { color: var(--primary); }

    /* Categories Dropdown Fixed */
    .dropdown { position: relative; display: inline-block; padding-bottom: 0.25rem; }
    .dropdown-menu {
      display: none; position: absolute; top: 100%; left: 0;
      background-color: var(--bg-card); min-width: 160px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      border-radius: 8px; z-index: 2000; overflow: hidden; padding: 0.5rem 0;
    }
    .dropdown-menu a {
      color: var(--text-main); padding: 0.65rem 1.2rem; text-decoration: none;
      display: block; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease;
    }
    .dropdown-menu a:hover { background-color: var(--bg-surface); color: var(--primary); }
    
    /* Hover activation */
    .dropdown:hover .dropdown-menu { display: block; animation: fadeIn 0.15s ease-in-out; }

    .nav-actions { display: flex; gap: 0.5rem; align-items: center; }

    button {
      cursor: pointer; padding: 0.55rem 1rem; border-radius: 8px; border: 1px solid transparent;
      font-weight: 600; font-size: 0.85rem; transition: all 0.2s ease;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    }

    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-outline { background: var(--bg-card); color: var(--text-main); border-color: var(--border); }
    .btn-outline:hover { background: var(--bg-surface); }

    .badge {
      background: var(--primary); color: #ffffff; border-radius: 9999px;
      padding: 2px 7px; font-size: 0.75rem; font-weight: 700;
    }

    main { padding: 1.5rem; flex: 1; max-width: 1280px; margin: 0 auto; width: 100%; }

    .controls-bar {
      display: flex; gap: 0.75rem; align-items: center; justify-content: flex-end;
      margin-bottom: 1.5rem; background: var(--bg-card); padding: 0.75rem 1rem; border-radius: var(--radius);
      border: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-wrap: wrap;
    }

    select {
      padding: 0.55rem 0.85rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-surface); color: var(--text-main); font-size: 0.85rem;
      cursor: pointer; flex: 1 1 140px; min-width: 130px;
    }

    .hero-banner {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; margin-bottom: 2rem; box-shadow: var(--shadow-md); position: relative;
    }
    .hero-slide { display: none; grid-template-columns: 1fr 1fr; align-items: center; min-height: 340px; padding: 2rem; gap: 1.5rem; }
    .hero-slide.active { display: grid; }
    .hero-content { display: flex; flex-direction: column; gap: 0.75rem; }
    .hero-tag {
      align-self: flex-start; padding: 0.25rem 0.7rem; border-radius: 9999px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      background: #dcfce7; color: #15803d;
    }

    .hero-title { font-size: 2rem; font-weight: 800; line-height: 1.2; }
    .hero-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
    .hero-price { font-size: 1.75rem; font-weight: 800; color: var(--text-main); }

    .hero-image-wrapper { height: 260px; width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); }
    .hero-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

    .hero-controls { position: absolute; bottom: 1rem; right: 1rem; display: flex; gap: 0.4rem; z-index: 10; }
    .hero-nav-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); font-weight: 700; }
    .hero-dots { position: absolute; bottom: 1.2rem; left: 1.5rem; display: flex; gap: 0.4rem; z-index: 10; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; }
    .dot.active { background: var(--primary); width: 20px; border-radius: 10px; }

    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
    }
    .card-img-wrapper { height: 200px; overflow: hidden; background: var(--bg-surface); }
    .card img { width: 100%; height: 100%; object-fit: cover; }

    .card-body { padding: 1rem; display: flex; flex-direction: column; flex: 1; }
    .card-category { font-size: 0.7rem; color: var(--primary); text-transform: uppercase; font-weight: 700; margin-bottom: 0.3rem; }
    .card-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.3rem; }
    .card-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; }
    .card-price { font-size: 1.15rem; font-weight: 800; }

    footer { background: var(--bg-card); border-top: 1px solid var(--border); padding: 1.75rem 1.5rem 1.25rem; margin-top: 3rem; }
    .footer-container { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1rem; margin-bottom: 1rem; }
    .footer-socials { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
    .social-icons { display: flex; gap: 0.75rem; }
    .social-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-surface); display: flex; align-items: center; justify-content: center; color: var(--text-main); text-decoration: none; font-weight: 700; border: 1px solid var(--border); }
    .footer-bottom { border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      header { flex-direction: column; align-items: stretch; padding: 0.85rem 1rem; }
      .header-left { justify-content: space-between; width: 100%; }
      .nav-bar { width: 100%; justify-content: space-around; border-top: 1px solid var(--border); padding-top: 0.75rem; }
      .nav-actions { width: 100%; justify-content: space-between; }
      .nav-actions button { flex: 1; }
      main { padding: 1rem; }
      .hero-slide { grid-template-columns: 1fr; padding: 1.25rem; text-align: center; min-height: auto; }
      .hero-tag { align-self: center; }
      .hero-image-wrapper { height: 200px; }
      .hero-dots { left: 50%; transform: translateX(-50%); bottom: 0.75rem; }
      .hero-controls { display: none; }
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0.85rem; }
      .card-img-wrapper { height: 150px; }
      .card-body { padding: 0.75rem; }
      .card-title { font-size: 0.9rem; }
      .card-price { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="index.html" class="logo">J.S Shop</a>
      <div class="nav-actions">
        <button class="btn-outline" id="theme-toggle-btn" onclick="toggleTheme()">🌙</button>
        <button class="btn-primary" onclick="toggleCart()">Cart <span class="badge" id="cart-count">0</span></button>
      </div>
    </div>

    <nav class="nav-bar">
      <a href="index.html" class="nav-link">Home</a>
      <div class="dropdown">
        <span class="nav-link">Categories ▾</span>
        <div class="dropdown-menu">
          <a href="#" onclick="filterByCategoryNav('Sneakers')">Sneakers</a>
          <a href="#" onclick="filterByCategoryNav('Formal')">Formal</a>
          <a href="#" onclick="filterByCategoryNav('Boots')">Boots</a>
          <a href="#" onclick="filterByCategoryNav('Sports')">Sports</a>
        </div>
      </div>
      <a href="#about-us" class="nav-link">About Us</a>
    </nav>
  </header>

  <main>
    <section id="user-view">
      <div class="controls-bar">
        <select id="category-filter" onchange="applyFilters()">
          <option value="All">All Categories</option>
          <option value="Sneakers">Sneakers</option>
          <option value="Formal">Formal</option>
          <option value="Boots">Boots</option>
          <option value="Sports">Sports</option>
        </select>
        <select id="sort-filter" onchange="applyFilters()">
          <option value="default">Sort by: Default</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
        </select>
      </div>

      <div class="hero-banner">
        <div id="hero-carousel-container"></div>
        <div class="hero-dots" id="hero-dots"></div>
        <div class="hero-controls">
          <button class="hero-nav-btn" onclick="prevHeroSlide()">‹</button>
          <button class="hero-nav-btn" onclick="nextHeroSlide()">›</button>
        </div>
      </div>

      <div class="product-grid" id="product-container"></div>
    </section>
  </main>

  <footer id="about-us">
    <div class="footer-container">
      <div class="footer-socials">
        <h3>Follow Us</h3>
        <div class="social-icons">
          <a href="#" class="social-icon">f</a>
          <a href="#" class="social-icon">ig</a>
          <a href="#" class="social-icon">tw</a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      &copy; 2026 J.S Shop. All Rights Reserved.
    </div>
  </footer>

  <script>
    let currentHeroIndex = 0;
    const initialStockSnapshot = [
      { id: 1, name: "Air Runner Max", category: "Sneakers", price: 129.99, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600", desc: "Lightweight performance sneakers." },
      { id: 2, name: "Oxford Classic", category: "Formal", price: 159.99, image: "https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?w=600", desc: "Handcrafted genuine leather shoes." },
      { id: 3, name: "Summit Hiker", category: "Boots", price: 189.99, image: "https://images.unsplash.com/photo-1520639888713-7851133b1ed0?w=600", desc: "Durable terrain boots." }
    ];

    let products = JSON.parse(localStorage.getItem('sole_products')) || initialStockSnapshot;

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      document.getElementById('theme-toggle-btn').innerText = isDark ? '☀️' : '🌙';
    }

    function renderHero() {
      const container = document.getElementById('hero-carousel-container');
      const dotsContainer = document.getElementById('hero-dots');
      if (!products.length) return;

      container.innerHTML = products.map((p, i) => `
        <div class="hero-slide ${i === currentHeroIndex ? 'active' : ''}">
          <div class="hero-content">
            <span class="hero-tag">Featured</span>
            <h1 class="hero-title">${p.name}</h1>
            <p class="hero-desc">${p.desc}</p>
            <span class="hero-price">$${p.price.toFixed(2)}</span>
          </div>
          <div class="hero-image-wrapper">
            <img src="${p.image}" alt="${p.name}">
          </div>
        </div>
      `).join('');

      dotsContainer.innerHTML = products.map((_, i) => `
        <span class="dot ${i === currentHeroIndex ? 'active' : ''}" onclick="setHeroSlide(${i})"></span>
      `).join('');
    }

    function setHeroSlide(index) { currentHeroIndex = index; renderHero(); }
    function nextHeroSlide() { currentHeroIndex = (currentHeroIndex + 1) % products.length; renderHero(); }
    function prevHeroSlide() { currentHeroIndex = (currentHeroIndex - 1 + products.length) % products.length; renderHero(); }

    function filterByCategoryNav(categoryName) {
      document.getElementById('category-filter').value = categoryName;
      applyFilters();
    }

    function applyFilters() {
      const category = document.getElementById('category-filter').value;
      const sort = document.getElementById('sort-filter').value;

      let filtered = products.filter(p => category === 'All' || p.category === category);
      if (sort === 'price-low') filtered.sort((a,b) => a.price - b.price);
      if (sort === 'price-high') filtered.sort((a,b) => b.price - a.price);

      renderProducts(filtered);
    }

    function renderProducts(items) {
      const container = document.getElementById('product-container');
      container.innerHTML = items.map(p => `
        <div class="card">
          <div class="card-img-wrapper">
            <img src="${p.image}" alt="${p.name}">
          </div>
          <div class="card-body">
            <span class="card-category">${p.category}</span>
            <h3 class="card-title">${p.name}</h3>
            <p class="card-desc">${p.desc}</p>
            <div class="card-footer">
              <span class="card-price">$${p.price.toFixed(2)}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    applyFilters();
    renderHero();
  </script>
</body>
</html>
